server.port=8080
spring.application.name=catalogo-service

# Actuator: exponer /metrics y /health
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Renombrar endpoint prometheus a /metrics
management.endpoints.web.path-mapping.prometheus=metrics

# Delay artificial para Casuística 2 (en milisegundos, 0 = sin delay)
catalogo.artificial.delay.ms=${CATALOGO_DELAY_MS:0}
