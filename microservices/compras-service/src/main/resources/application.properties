server.port=8081
spring.application.name=compras-service

# Actuator: exponer /metrics y /health
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Renombrar endpoint prometheus a /metrics
management.endpoints.web.path-mapping.prometheus=metrics

# URL del catálogo-service (se sobreescribe con variable de entorno en K8s)
catalogo.service.url=${CATALOGO_SERVICE_URL:http://localhost:8080}

# Timeout de conexión al catálogo (en segundos)
catalogo.service.timeout.seconds=${CATALOGO_TIMEOUT_SECONDS:3}
