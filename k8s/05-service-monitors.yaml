# ServiceMonitor para catalogo-service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: catalogo-service-monitor
  namespace: tienda-ropa
  labels:
    # Este label debe coincidir con el serviceMonitorSelector del values.yaml
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      # Debe coincidir EXACTAMENTE con los labels del Service de catalogo
      app: catalogo-service
      monitored: "true"
  endpoints:
    - port: http          # Nombre del puerto en el Service
      path: /metrics      # Ruta donde Spring Boot expone las métricas
      interval: 15s       # Cada 15 segundos Prometheus raspa las métricas
  namespaceSelector:
    matchNames:
      - tienda-ropa
---
# ServiceMonitor para compras-service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: compras-service-monitor
  namespace: tienda-ropa
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: compras-service
      monitored: "true"
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - tienda-ropa
