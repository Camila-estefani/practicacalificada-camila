apiVersion: v1
kind: Service
metadata:
  name: catalogo-service
  namespace: tienda-ropa
  labels:
    # Estos labels DEBEN coincidir exactamente con el selector del ServiceMonitor
    app: catalogo-service
    monitored: "true"
spec:
  type: NodePort
  selector:
    app: catalogo-service
  ports:
    - name: http         # El ServiceMonitor referencia el puerto por este nombre
      port: 8080
      targetPort: 8080
      nodePort: 30080    # Puerto accesible desde fuera del cluster
