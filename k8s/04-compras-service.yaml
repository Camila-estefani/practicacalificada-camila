apiVersion: v1
kind: Service
metadata:
  name: compras-service
  namespace: tienda-ropa
  labels:
    app: compras-service
    monitored: "true"
spec:
  type: NodePort
  selector:
    app: compras-service
  ports:
    - name: http         # El ServiceMonitor referencia el puerto por este nombre
      port: 8081
      targetPort: 8081
      nodePort: 30081    # Puerto accesible desde fuera del cluster
